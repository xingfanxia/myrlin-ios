name: MyrlinMobile
options:
  bundleIdPrefix: com.myrlin
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15"
  generateEmptyDirectories: true
targets:
  MyrlinMobile:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: MyrlinMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myrlin.mobile
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: ""
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: MyrlinMobile/Info.plist
    scheme:
      testTargets:
        - MyrlinMobileTests
  MyrlinMobileTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: MyrlinMobileTests
    dependencies:
      - target: MyrlinMobile
